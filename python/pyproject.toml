[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcm-python-tools"
version = "0.1.0"
description = "Python processing and validation tooling for the General Curriculum Mapper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["."]
include = ["validation*", "processing*"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="honeycombGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>

    <linearGradient id="softGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfccb"/>
      <stop offset="100%" stop-color="#d9f99d"/>
    </linearGradient>

    <linearGradient id="goldHex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Clip Path for Spine Curve -->
    <clipPath id="bookSpine">
      <rect x="0" y="0" width="600" height="800" rx="6" ry="6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bookSpine)">
    <!-- Main Background -->
    <rect width="600" height="800" fill="url(#bgGrad)"/>

    <!-- Subtle Background Honeycomb Lattice Pattern -->
    <g opacity="0.35" stroke="#cbd5e1" stroke-width="2" fill="none">
      <polygon points="500,160 540,183 540,229 500,252 460,229 460,183" fill="#f0fdf4"/>
      <polygon points="540,229 580,252 580,298 540,321 500,298 500,252"/>
      <polygon points="100,200 140,223 140,269 100,292 60,269 60,223" fill="#f7fee7"/>
      <polygon points="60,269 100,292 100,338 60,361 20,338 20,292"/>
      <polygon points="520,480 560,503 560,549 520,572 480,549 480,503" fill="#f0fdf4"/>
    </g>

    <!-- TOP NAVY BAR (Oxford Branding) -->
    <rect x="0" y="0" width="600" height="54" fill="#002147"/>
    <text x="300" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="8" fill="#ffffff" text-anchor="middle">
      OXFORD
    </text>

    <!-- MAIN TITLE: Beehive -->
    <!-- Green Outline Effect matching official Beehive Logo -->
    <g transform="translate(300, 140)" filter="url(#shadow)">
      <!-- Outer Stroke Layer -->
      <text x="0" y="0" font-family="'Fredoka', 'Quicksand', 'Arial Rounded MT Bold', -apple-system, sans-serif" font-size="88" font-weight="900" fill="#ffffff" stroke="#65a30d" stroke-width="14" stroke-linejoin="round" text-anchor="middle">
        Beehive
      </text>
      <!-- Inner Solid Text -->
      <text x="0" y="0" font-family="'Fredoka', 'Quicksand', 'Arial Rounded MT Bold', -apple-system, sans-serif" font-size="88" font-weight="900" fill="#ffffff" text-anchor="middle">
        Beehive
      </text>
    </g>

    <!-- SUBTITLE HEX BADGE: Student Book with Online Practice -->
    <g transform="translate(300, 185)">
      <rect x="-110" y="-14" width="220" height="28" rx="14" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" filter="url(#softGlow)"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#713f12" text-anchor="middle">
        Student Book
      </text>
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#65a30d" text-anchor="middle">
        with Online Practice
      </text>
    </g>

    <!-- CENTERPIECE LEVEL HEXAGON: 1 -->
    <g transform="translate(300, 260)" filter="url(#shadow)">
      <!-- Large Hexagon Base -->
      <polygon points="0,-65 56,-32 56,32 0,65 -56,32 -56,-32" fill="url(#honeycombGreen)" stroke="#ffffff" stroke-width="4"/>
      <!-- Inner Number 1 -->
      <text x="0" y="28" font-family="'Arial Rounded MT Bold', 'Fredoka', -apple-system, sans-serif" font-size="80" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#softGlow)">
        1
      </text>
    </g>

    <!-- HONEYCOMB PHOTO TILES (Authentic Classroom Scenes & Characters) -->
    <!-- Tile Left: Smiling boy raising hand -->
    <g transform="translate(130, 310)" filter="url(#shadow)">
      <polygon points="0,-75 65,-37 65,37 0,75 -65,37 -65,-37" fill="#bae6fd" stroke="#ffffff" stroke-width="5"/>
      <!-- Scene Illustration: Child raising hand in classroom -->
      <circle cx="0" cy="-10" r="30" fill="#f5d0b5"/>
      <path d="M-20,-25 Q0,-45 20,-25" fill="#475569"/>
      <!-- Raised arm -->
      <path d="M15,-5 Q35,-35 45,-60" stroke="#f5d0b5" stroke-width="14" stroke-linecap="round"/>
      <path d="M-40,55 Q0,20 40,55" fill="#0284c7"/>
    </g>

    <!-- Tile Right: Smiling girl studying -->
    <g transform="translate(470, 310)" filter="url(#shadow)">
      <polygon points="0,-75 65,-37 65,37 0,75 -65,37 -65,-37" fill="#fed7aa" stroke="#ffffff" stroke-width="5"/>
      <!-- Scene Illustration: Girl with smile -->
      <circle cx="0" cy="-10" r="28" fill="#e2b997"/>
      <path d="M-26,-20 Q0,-48 26,-20" fill="#9a3412"/>
      <path d="M-28,-15 Q-35,10 -20,25" fill="#9a3412"/>
      <path d="M28,-15 Q35,10 20,25" fill="#9a3412"/>
      <path d="M-35,55 Q0,25 35,55" fill="#ea580c"/>
    </g>

    <!-- Tile Center-Bottom: Children working together at desk -->
    <g transform="translate(300, 470)" filter="url(#shadow)">
      <polygon points="0,-95 82,-47 82,47 0,95 -82,47 -82,-47" fill="#dcfce7" stroke="#ffffff" stroke-width="6"/>
      <!-- Desk Scene -->
      <rect x="-70" y="30" width="140" height="20" rx="3" fill="#cbd5e1"/>
      <!-- Child 1 on left -->
      <circle cx="-35" cy="0" r="22" fill="#fed7aa"/>
      <path d="M-50,-10 Q-35,-30 -20,-10" fill="#1e293b"/>
      <path d="M-55,40 Q-35,15 -15,40" fill="#3b82f6"/>
      <!-- Child 2 on right -->
      <circle cx="35" cy="0" r="22" fill="#fcd34d"/>
      <path d="M20,-10 Q35,-30 50,-10" fill="#854d0e"/>
      <path d="M15,40 Q35,15 55,40" fill="#10b981"/>
      <!-- Textbook on desk -->
      <rect x="-18" y="15" width="36" height="24" rx="2" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Tile Bottom-Left: Boy smiling with glasses -->
    <g transform="translate(130, 520)" filter="url(#shadow)">
      <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="#fef08a" stroke="#ffffff" stroke-width="5"/>
      <circle cx="0" cy="-8" r="26" fill="#fcd34d"/>
      <path d="M-22,-20 Q0,-42 22,-20" fill="#451a03"/>
      <!-- Glasses -->
      <rect x="-16" y="-12" width="12" height="10" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
      <rect x="4" y="-12" width="12" height="10" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
      <line x1="-4" y1="-7" x2="4" y2="-7" stroke="#0f172a" stroke-width="2"/>
      <path d="M-35,50 Q0,20 35,50" fill="#ca8a04"/>
    </g>

    <!-- Tile Bottom-Right: Two happy friends -->
    <g transform="translate(470, 520)" filter="url(#shadow)">
      <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="#fce7f3" stroke="#ffffff" stroke-width="5"/>
      <circle cx="-15" cy="-8" r="20" fill="#f5d0b5"/>
      <path d="M-30,-18 Q-15,-34 0,-18" fill="#475569"/>
      <path d="M-32,45 Q-15,15 2,45" fill="#ec4899"/>
      <circle cx="20" cy="-5" r="20" fill="#fed7aa"/>
      <path d="M6,-15 Q20,-32 34,-15" fill="#713f12"/>
      <path d="M3,48 Q20,18 37,48" fill="#8b5cf6"/>
    </g>

    <!-- Author Badge (Cheryl Palin) -->
    <g transform="translate(50, 715)">
      <text x="0" y="0" font-family="'Segoe Script', 'Brush Script MT', cursive, sans-serif" font-size="16" font-style="italic" fill="#334155">
        Cheryl Palin
      </text>
    </g>

    <!-- BOTTOM NAVY BAR: Student Book -->
    <rect x="0" y="746" width="600" height="54" fill="#002147"/>
    <text x="300" y="781" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" letter-spacing="1.5" fill="#ffffff" text-anchor="middle">
      Student Book
    </text>

    <!-- Spine Highlight Reflection on Left Edge -->
    <rect x="0" y="0" width="14" height="800" fill="#ffffff" opacity="0.18"/>
    <line x1="14" y1="0" x2="14" y2="800" stroke="#000000" stroke-width="1" opacity="0.15"/>
  </g>
</svg>
